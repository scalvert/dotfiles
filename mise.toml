#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2025.3.1"

[tasks.default]
description = "List available mise tasks"
run = "mise tasks ls --local"

[tasks.install]
description = "Complete system setup"
run = [
  "mise run system:install",
  "mise run binutils:install",
  "mise run dotfiles:install",
  "mise run ai:install",
  "mise run stack:install",
  "mise run nvim:restore",
]

[tasks."reset:dry-run"]
description = "Preview removing managed dotfile symlinks"
run = "./scripts/dotfiles reset"

[tasks.reset]
description = "Remove managed dotfile symlinks without deleting app state or secrets"
run = "./scripts/dotfiles reset --apply"

[tasks."bootstrap:preflight"]
description = "Run preflight checks before installation"
run = "./scripts/bootstrap preflight"

[tasks."bootstrap:status"]
description = "Show current system status"
run = "./scripts/bootstrap status"

[tasks."system:install"]
description = "Install all system dependencies"
depends = ["brew:install", "mise:install", "mise:update"]

[tasks."brew:install"]
description = "Install Homebrew and tools defined in Brewfile"
run = "./scripts/bootstrap install-homebrew && { brew bundle || echo '⚠️  brew bundle: some formulae/casks failed — continuing so shell + config still get set up'; }"

[tasks."brew:work"]
description = "Install work-machine apps from Brewfile.work (run only on work machines)"
run = "brew bundle --file=Brewfile.work"

[tasks."brew:update"]
description = "Update Brewfile with current brew packages"
run = "brew bundle dump --force --describe"

[tasks."brew:upgrade"]
description = "Update Homebrew and upgrade installed packages"
run = "brew update && brew upgrade && mise run brew:update"

[tasks."brew:cleanup"]
description = "Remove unused Homebrew dependencies"
run = "brew cleanup && brew autoremove"

[tasks."binutils:install"]
description = "Build binutils and set up symlinks"
run = "./scripts/binutils install"

[tasks."binutils:cache-shell-startup"]
description = "Refresh generated shell startup cache"
run = "./scripts/binutils cache-shell-startup"

[tasks."dotfiles:install"]
description = "Install dotfiles"
run = "./scripts/dotfiles install"
alias = "dot:install"

[tasks."shell:update"]
description = "Refresh shell startup and completion caches"
run = "./scripts/dotfiles refresh-shell"

[tasks."nvim:restore"]
description = "Restore Neovim plugins from lazy-lock.json"
run = "./scripts/nvim restore"

[tasks."nvim:update"]
description = "Update Neovim plugins and commit lazy-lock.json if changed"
run = "./scripts/nvim update"

[tasks."ai:install"]
description = "Install personal AI stack links and validate configuration"
depends = ["ai:validate"]

[tasks."ai:validate"]
description = "Validate personal AI stack configuration"
run = "./scripts/ai-stack validate"

[tasks."stack:install"]
description = "Clone the personal stack repos (wiki, skills) if absent"
run = "./scripts/stack install"

[tasks."ai:doctor"]
description = "Run AI stack architecture and generated-artifact checks"
run = "./scripts/ai-stack doctor"

[tasks."git:doctor"]
description = "Report git-config drift and identity problems before they reach a new machine"
run = "./scripts/git-doctor"

[tasks."ai:completion:audit"]
description = "Report requirement coverage for the personal AI stack consolidation goal"
run = "./scripts/ai-stack completion-audit"

[tasks."ai:completion:audit:strict"]
description = "Fail unless the personal AI stack consolidation goal has complete evidence"
run = "./scripts/ai-stack completion-audit --strict"

[tasks."ai:bootstrap:verify"]
description = "Run bootstrap verification gates and write a sanitized pass record"
run = "./scripts/ai-stack bootstrap-verify"

[tasks."ai:bootstrap:verify:preflight"]
description = "Check whether the current machine/user is suitable for bootstrap verification"
run = "./scripts/ai-stack bootstrap-verify-preflight"

[tasks."ai:bootstrap:verification:plan"]
description = "Print the fresh-machine bootstrap verification handoff runbook"
run = "./scripts/ai-stack bootstrap-verification-plan"

[tasks."ai:inventory"]
description = "Show personal AI stack inventory"
run = "./scripts/ai-stack inventory"

[tasks."ai:live-inventory"]
description = "Inspect live AI config surfaces on this machine"
run = "./scripts/ai-stack live-inventory"

[tasks."ai:review"]
description = "Report AI stack consolidation and archive recommendations"
run = "./scripts/ai-stack review"

[tasks."ai:feedback"]
description = "Run AI stack review plus managed skill drift checks"
run = "./scripts/ai-stack feedback"

[tasks."ai:usage"]
description = "Show names-only AI skill and command age signals"
run = "./scripts/ai-stack usage"

[tasks."ai:usage:report"]
description = "Write a local names-only usage age report"
run = "./scripts/ai-stack usage-report"

[tasks."ai:prompt:plan"]
description = "Write a local prompt improvement recommendation plan"
run = "./scripts/ai-stack prompt-plan"

[tasks."ai:archive:plan"]
description = "Write a local archive/consolidation plan for skills and commands"
run = "./scripts/ai-stack archive-plan"

[tasks."ai:report"]
description = "Write a dated AI stack review report under packages/ai/reviews"
run = "./scripts/ai-stack report"

[tasks."ai:snapshot:skills"]
description = "Update the managed skill lock snapshot from the live .agents lockfile"
run = "./scripts/ai-stack snapshot-skills"

[tasks."ai:skill:drift"]
description = "Compare live managed skills against the checked-in snapshot"
run = "./scripts/ai-stack skill-drift"

[tasks."ai:generate:commands"]
description = "Generate client command shims from canonical AI command specs"
run = "./scripts/ai-stack generate-commands"

[tasks."ai:diff:commands"]
description = "Compare generated command shims against live client command files"
run = "./scripts/ai-stack diff-commands"

[tasks."ai:generate:mcp"]
description = "Generate public-safe MCP profiles from the canonical MCP catalog"
run = "./scripts/ai-stack generate-mcp"

[tasks."ai:diff:mcp"]
description = "Compare generated MCP profiles against live client MCP files"
run = "./scripts/ai-stack diff-mcp"

[tasks."ai:install:commands:dry-run"]
description = "Preview installing generated command shims into live client command folders"
run = "./scripts/ai-stack install-commands"

[tasks."ai:install:commands"]
description = "Install generated command shims into live client command folders with backups"
run = "./scripts/ai-stack install-commands --apply"

[tasks."ai:reset:commands:dry-run"]
description = "Preview restoring/removing generated command shims from the install manifest"
run = "./scripts/ai-stack reset-commands"

[tasks."ai:reset:commands"]
description = "Restore/remove generated command shims using the install manifest"
run = "./scripts/ai-stack reset-commands --apply"

[tasks."ai:reset:dry-run"]
description = "Preview resetting installed AI command shims and managed AI config link"
run = "./scripts/ai-stack reset"

[tasks."ai:reset"]
description = "Reset installed AI command shims and managed AI config link"
run = "./scripts/ai-stack reset --apply"

[tasks."ai:sync:mcp"]
description = "Sync shared MCP profile into packages/mcp"
run = "./scripts/ai-stack sync-mcp"

[tasks."mise:install"]
description = "Install all mise-managed tools"
run = "./scripts/mise-tools install"

[tasks."mise:update"]
description = "Update all mise-managed tools"
run = "./scripts/mise-tools update"
alias = "mise:up"

[tasks."mise:outdated"]
description = "List outdated mise-managed tools"
run = "./scripts/mise-tools outdated"

[tasks."migration:go-task:retire-check"]
description = "Verify primary surfaces no longer depend on go-task"
run = "./scripts/mise-migration go-task-retire-check"

[tasks."migration:go-task:archive-compat:dry-run"]
description = "Preview archiving legacy go-task compatibility files after bootstrap verification"
run = "./scripts/mise-migration go-task-archive-compat"

[tasks."migration:go-task:archive-compat"]
description = "Archive legacy go-task compatibility files after bootstrap verification"
run = "./scripts/mise-migration go-task-archive-compat --apply"
