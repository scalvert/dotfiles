# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

vars:
  SECRETS_DIR: "{{.ROOT_DIR}}/packages/secrets"

tasks:
  export:
    desc: Export secrets to an encrypted GPG tarball
    summary: |
      Exports SSH keys, GPG keys, and local config files to an encrypted archive.

      Usage:
        task secrets:export              # Creates secrets-YYYYMMDD.tar.gpg
        task secrets:export -- custom.tar.gpg  # Custom output file

      The archive is encrypted with AES256 using a passphrase you provide.
    cmds:
      - "{{.SECRETS_DIR}}/export.sh {{.CLI_ARGS}}"

  import:
    desc: Import secrets from an encrypted GPG tarball
    summary: |
      Imports SSH keys, GPG keys, and local config files from an encrypted archive.

      Usage:
        task secrets:import -- secrets-20260201.tar.gpg

      You'll be prompted for the passphrase used during export.
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task secrets:import -- <secrets-file.tar.gpg>"
          exit 1
        fi
        "{{.SECRETS_DIR}}/import.sh" {{.CLI_ARGS}}

  list:
    desc: List files that would be exported
    summary: |
      Shows which files would be included in a secrets export.
    cmds:
      - |
        echo "=== SSH Keys ==="
        ls -la ~/.ssh/id_* ~/.ssh/config ~/.ssh/known_hosts 2>/dev/null || echo "  (none found)"
        echo ""
        echo "=== GPG Keys ==="
        gpg --list-secret-keys --keyid-format LONG 2>/dev/null || echo "  (none found)"
        echo ""
        echo "=== Local Config Files ==="
        for file in ~/.gitconfig.local ~/.zshrc.local ~/.npmrc ~/.config/fish/local.fish ~/.config/gh/hosts.yml; do
          if [ -f "$file" ]; then
            echo "  $file"
          fi
        done
        echo ""
        echo "=== Environment Files ==="
        for file in ~/.env ~/.envrc; do
          if [ -f "$file" ]; then
            echo "  $file"
          fi
        done
