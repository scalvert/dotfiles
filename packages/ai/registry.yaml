# Canonical personal AI stack inventory.
# Keep this file human-reviewable. Generated state, auth, histories, and caches do not belong here.
version: 1
owner: steve
last_audited: 2026-06-03

decisions:
  foundation:
    status: keep
    path: ~/workspace/personal/dotfiles
    rationale: Existing dotfiles already provide bootstrap, package layout, Taskfile orchestration, Homebrew, mise, shell, editor, MCP, and Claude templates.
  source_of_truth:
    status: consolidate
    path: packages/ai
    rationale: Shared skills, prompts, agents, MCP catalog, feedback policy, and lifecycle decisions need one durable home.

tooling:
  package_managers:
    homebrew:
      status: keep
      source: Brewfile
      notes: Homebrew remains the macOS system package layer.
    mise:
      status: keep
      source: packages/mise/config.toml
      notes: Runtime and developer tool versions belong in mise.
    uv:
      status: keep
      source: mise-managed
      notes: Prefer uvx for ephemeral Python MCP/server tools.
    npm:
      status: consolidate
      source: mise-managed node plus explicit global exceptions
      notes: Avoid unmanaged global npm installs unless a tool has no better install path.

clients:
  codex:
    status: keep
    config: ~/.codex/config.toml
    owns:
      - app plugins
      - local browser/node_repl runtime configuration
      - trust decisions
      - auth and history
    consolidate:
      - reusable custom skills
      - reusable MCP server definitions
      - global behavior preferences
  claude:
    status: consolidate
    config: ~/.claude/settings.json
    owns:
      - Claude Code plugin enablement
      - local hooks
      - auth and history
    consolidate:
      - duplicated Plannotator skills and commands
      - reusable global CLAUDE.md guidance
  cursor:
    status: consolidate
    config: ~/.cursor
    owns:
      - Cursor built-in and managed skills
      - Cursor IDE state
    consolidate:
      - custom commands and non-built-in skills
  neovim:
    status: keep
    config: packages/nvim
    owns:
      - CodeCompanion UI bindings
      - editor keymaps
    consolidate:
      - reusable prompt text
      - MCP server catalog
  opencode:
    status: consolidate
    config: ~/.config/opencode
    notes: Duplicate Plannotator commands should be generated from shared command specs.
  goose:
    status: archive
    config: ~/.config/goose
    notes: Keep only if it has an active workflow not covered by Codex, Claude, Cursor, or Neovim.
  crush:
    status: archive
    config: ~/.config/crush
    notes: No active workflow found during initial audit.
  superpowers:
    status: archive
    config: ~/.config/superpowers
    notes: Treat as experiment unless an active workflow is identified.

mcp_servers:
  fetch:
    status: keep
    profile: shared-stdio
    command: uvx
    args: ["mcp-server-fetch", "--ignore-robots-txt"]
  package-version:
    status: keep
    profile: shared-stdio
    command: npx
    args: ["-y", "mcp-package-version"]
  glean_default:
    status: keep
    profile: client-http
    url: local-only
    notes: Configure the company Glean MCP URL in local client config. Do not put auth or internal hostnames in git.
  linear:
    status: keep
    profile: client-http
    url: https://mcp.linear.app/mcp
    notes: Used by Codex skills and Linear workflow.
  node_repl:
    status: keep-local
    profile: codex-runtime
    notes: Codex app runtime server; generated by the app, not by dotfiles.

skills:
  plannotator:
    status: consolidate
    sources:
      - ~/.claude/skills/plannotator-*
      - ~/.agents/skills/plannotator-*
      - ~/.codex/skills/plannotator-*
      - ~/.claude/commands/plannotator-*.md
      - ~/.config/opencode/commands/plannotator-*.md
    target: packages/ai/skills/plannotator plus generated client shims
  glean:
    status: keep
    sources:
      - ~/.agents/skills/glean-*
      - ~/.claude/skills/glean-cli
    target: managed external skill bundle with lock metadata
  linear:
    status: keep
    sources:
      - ~/.agents/skills/linear-*
    target: managed external skill bundle with lock metadata
  gws:
    status: keep
    sources:
      - ~/.agents/skills/gws-*
    target: managed external skill bundle with lock metadata
  cursor_builtin:
    status: keep-local
    sources:
      - ~/.cursor/skills-cursor
    target: Cursor-managed; inventory only.
  scio_go_style:
    status: keep
    sources:
      - ~/.codex/skills/scio-go-style
    target: project/work-specific skill; consider promoting only if reused outside scio.
  council_and_omc:
    status: replace
    sources:
      - ~/.claude/CLAUDE.md OMC section
      - ~/.claude/skills/agent-council*
    target: Explicit agent definitions with a smaller orchestration policy.

prompts:
  codecompanion_commit:
    status: keep
    source: packages/nvim/lua/rwjblue/codecompanion/prompts/commit.lua
    target: packages/ai/prompts/commit-message.md
  codecompanion_algorithms_interviewer:
    status: keep
    source: packages/nvim/lua/rwjblue/codecompanion/prompts/algorithms_interviewer.lua
    target: packages/ai/prompts/algorithms-interviewer.md
  cursor_go_review:
    status: consolidate
    source: ~/.cursor/commands/go-review.md
    target: packages/ai/prompts/scio-go-review.md or project-local scio skill

knowledge:
  obsidian:
    status: keep
    source: ~/Documents/Obsidian Vault
    notes: Personal long-term notes; do not merge into tool instructions.
  glean:
    status: keep
    source: Glean MCP and CLI skills
    notes: Enterprise knowledge access; keep as external system.
  claude_memory:
    status: consolidate
    source: ~/.claude/CLAUDE.md and hooks
    notes: Extract reusable preferences into packages/ai; keep client runtime memory local.
  codex_memory:
    status: keep-local
    source: ~/.codex/memories_*.sqlite
    notes: App-owned memory store; inventory only.

lifecycle:
  keep:
    - dotfiles Taskfile bootstrap
    - Homebrew Brewfile
    - mise runtime management
    - fish shell configuration
    - Neovim CodeCompanion integration
    - Glean and Linear skill bundles
  consolidate:
    - Plannotator skills and commands
    - MCP catalog
    - reusable prompts
    - global behavior preferences
    - feedback hooks
  replace:
    - implicit multi-agent orchestration scattered through CLAUDE.md
  archive:
    - inactive Goose/Crush/Superpowers experiments
    - duplicate command shims after generated replacements exist
  delete:
    - nothing yet
